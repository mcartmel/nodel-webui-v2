name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin and verify Node.js/npm, then install dependencies
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          package_manager="$(node --print "require('${GITHUB_WORKSPACE}/package.json').packageManager")"
          npm_version="${package_manager#npm@}"
          npm_prefix="${RUNNER_TEMP}/npm-toolchain"
          npm install --global --prefix "$npm_prefix" "npm@${npm_version}"
          export PATH="${npm_prefix}/bin:${PATH}"
          printf '%s\n' "${npm_prefix}/bin" >> "$GITHUB_PATH"
          cd "$GITHUB_WORKSPACE"
          expected_node="$(tr -d '[:space:]' < .nvmrc)"
          actual_node="$(node --version)"
          actual_npm="$(npm --version)"
          printf 'Node.js: %s (expected v%s)\nnpm: %s (expected %s)\n' "$actual_node" "$expected_node" "$actual_npm" "$npm_version"
          test "$actual_node" = "v${expected_node}"
          test "$actual_npm" = "$npm_version"
          npm ci

      - name: Report component contract impact
        if: always()
        run: npm run report:component-contract

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check JsViews templates
        run: npm run check:jsviews

      - name: Build preview
        run: npm run build:preview

      - name: Verify release gate
        run: node scripts/verify-release-gate.mjs --icon-profile free

      - name: Verify public Free profile and dependency boundary
        run: npm run verify:public-release

      - name: Report bundle budget
        if: always()
        run: npm run report:bundle-budget

      - name: Run full per-file coverage tests
        run: npm run test:coverage -- --coverage.all

      - name: Verify dependency evidence and audit
        run: npm run verify:dependencies

      - name: Upload dependency evidence and audit reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-evidence
          path: build/dependency-evidence/
          if-no-files-found: warn

      - name: Verify review impact
        run: npm run verify:review-impact

      - name: Upload review impact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-impact
          path: |
            build/contract-report/
            build/bundle-budget.json
            build/bundle-budget.md
            build/review-impact/
            build/bundle-graph.json
          if-no-files-found: warn

      - name: Capture tested dist inventory
        run: npm run verify:dist -- --write --json --icon-profile free

      - name: Upload exact tested dist and inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tested-dist
          path: |
            dist/
            build/dist-inventory.json
          if-no-files-found: error

  browser-deployment:
    needs: [quality, java-handoff]
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout source for test scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin and verify Node.js/npm, then install dependencies
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          package_manager="$(node --print "require('${GITHUB_WORKSPACE}/package.json').packageManager")"
          npm_version="${package_manager#npm@}"
          npm_prefix="${RUNNER_TEMP}/npm-toolchain"
          npm install --global --prefix "$npm_prefix" "npm@${npm_version}"
          export PATH="${npm_prefix}/bin:${PATH}"
          printf '%s\n' "${npm_prefix}/bin" >> "$GITHUB_PATH"
          cd "$GITHUB_WORKSPACE"
          expected_node="$(tr -d '[:space:]' < .nvmrc)"
          actual_node="$(node --version)"
          actual_npm="$(npm --version)"
          printf 'Node.js: %s (expected v%s)\nnpm: %s (expected %s)\n' "$actual_node" "$expected_node" "$actual_npm" "$npm_version"
          test "$actual_node" = "v${expected_node}"
          test "$actual_npm" = "$npm_version"
          npm ci

      - name: Download exact tested dist and inventory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tested-dist
          path: .

      - name: Verify release gate against downloaded dist
        run: node scripts/verify-release-gate.mjs --icon-profile free

      - name: Verify downloaded dist inventory
        run: npm run verify:dist -- --check --json --icon-profile free

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Generate Free icon assets for Vite preview
        run: npm run generate:icons:free

      - name: Run browser visual and accessibility tests
        run: npm run test:browser:dist

      - name: Create deployment smoke roots from downloaded dist
        run: |
          node scripts/deploy.mjs --target ./build/deploy-preview --icon-profile free
          node scripts/deploy.mjs --target ./build/stage11-host/custom/content --icon-profile free

      - name: Smoke deployed layouts
        run: npm run test:deployment:smoke

      - name: Verify exact dist continuity
        run: npm run verify:dist -- --check --json --icon-profile free

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  java-handoff:
    name: Java handoff (${{ matrix.java-branch }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        java-branch: [dev, master]

    steps:
      - name: Checkout web UI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: webui
          persist-credentials: false

      - name: Checkout Java Nodel
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: museumsvictoria/nodel
          ref: ${{ matrix.java-branch }}
          path: nodel
          persist-credentials: false

      - name: Put Java checkout on named branch
        working-directory: webui
        run: git -C ../nodel switch -C "${{ matrix.java-branch }}" --track "origin/${{ matrix.java-branch }}"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: webui/.nvmrc
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Verify Java handoff manifest and collision compatibility
        working-directory: webui
        run: >-
          node scripts/verify-java-handoff.mjs
          --java-checkout ../nodel
          --expected-branch "${{ matrix.java-branch }}"
          --output "build/java-handoff/${{ matrix.java-branch }}.json"
          --json

      - name: Upload Java handoff report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: java-handoff-${{ matrix.java-branch }}
          path: webui/build/java-handoff/${{ matrix.java-branch }}.json
          if-no-files-found: error
