name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@3c4e3dcb1aa7874d2c16be7d79418e9b7efd6261 # v4.8.2
        with:
          fail-on-severity: high

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check JsViews templates
        run: npm run check:jsviews

      - name: Run full per-file coverage tests
        run: npm run test:coverage -- --coverage.all

      - name: Verify dependency evidence and audit
        run: npm run verify:dependencies

      - name: Upload dependency evidence and audit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-evidence
          path: build/dependency-evidence/
          if-no-files-found: warn

      - name: Build preview
        run: npm run build:preview

      - name: Verify release gate
        run: node scripts/verify-release-gate.mjs

      - name: Capture tested dist inventory
        run: npm run verify:dist -- --write --json

      - name: Upload exact tested dist and inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tested-dist
          path: |
            dist/
            build/dist-inventory.json
          if-no-files-found: error

  browser-deployment:
    needs: [quality, java-handoff]
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source for test scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download exact tested dist and inventory
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tested-dist
          path: .

      - name: Verify release gate against downloaded dist
        run: node scripts/verify-release-gate.mjs

      - name: Verify downloaded dist inventory
        run: npm run verify:dist -- --check --json

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run browser visual and accessibility tests
        run: npm run test:browser:dist

      - name: Create deployment smoke roots from downloaded dist
        run: |
          node scripts/deploy.mjs --target ./build/deploy-preview
          node scripts/deploy.mjs --target ./build/stage11-host/custom/content

      - name: Smoke deployed layouts
        run: npm run test:deployment:smoke

      - name: Verify exact dist continuity
        run: npm run verify:dist -- --check --json

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  java-handoff:
    name: Java handoff (${{ matrix.java-branch }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        java-branch: [dev, master]

    steps:
      - name: Checkout web UI
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: webui
          persist-credentials: false

      - name: Checkout Java Nodel
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: museumsvictoria/nodel
          ref: ${{ matrix.java-branch }}
          path: nodel
          persist-credentials: false

      - name: Put Java checkout on named branch
        working-directory: webui
        run: git -C ../nodel switch -C "${{ matrix.java-branch }}" --track "origin/${{ matrix.java-branch }}"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.12.0
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Verify Java handoff manifest and collision compatibility
        working-directory: webui
        run: >-
          node scripts/verify-java-handoff.mjs
          --java-checkout ../nodel
          --expected-branch "${{ matrix.java-branch }}"
          --output "build/java-handoff/${{ matrix.java-branch }}.json"
          --json

      - name: Upload Java handoff report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: java-handoff-${{ matrix.java-branch }}
          path: webui/build/java-handoff/${{ matrix.java-branch }}.json
          if-no-files-found: error
