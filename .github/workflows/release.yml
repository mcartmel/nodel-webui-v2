name: Publish Release Bundle

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  java-handoff:
    name: Java handoff (${{ matrix.java-branch }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        java-branch: [dev, master]

    steps:
      - name: Checkout web UI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: webui
          persist-credentials: false

      - name: Checkout Java Nodel
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: museumsvictoria/nodel
          ref: ${{ matrix.java-branch }}
          path: nodel
          persist-credentials: false

      - name: Put Java checkout on named branch
        working-directory: webui
        run: git -C ../nodel switch -C "${{ matrix.java-branch }}" --track "origin/${{ matrix.java-branch }}"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: webui/.nvmrc
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Verify Java handoff manifest and collision compatibility
        working-directory: webui
        run: >-
          node scripts/verify-java-handoff.mjs
          --java-checkout ../nodel
          --expected-branch "${{ matrix.java-branch }}"
          --output "build/java-handoff/${{ matrix.java-branch }}.json"
          --json

      - name: Upload Java handoff report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: java-handoff-${{ matrix.java-branch }}
          path: webui/build/java-handoff/${{ matrix.java-branch }}.json
          if-no-files-found: error

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin and verify Node.js/npm, then install dependencies
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          package_manager="$(node --print "require('${GITHUB_WORKSPACE}/package.json').packageManager")"
          npm_version="${package_manager#npm@}"
          npm_prefix="${RUNNER_TEMP}/npm-toolchain"
          npm install --global --prefix "$npm_prefix" "npm@${npm_version}"
          export PATH="${npm_prefix}/bin:${PATH}"
          printf '%s\n' "${npm_prefix}/bin" >> "$GITHUB_PATH"
          cd "$GITHUB_WORKSPACE"
          expected_node="$(tr -d '[:space:]' < .nvmrc)"
          actual_node="$(node --version)"
          actual_npm="$(npm --version)"
          printf 'Node.js: %s (expected v%s)\nnpm: %s (expected %s)\n' "$actual_node" "$expected_node" "$actual_npm" "$npm_version"
          test "$actual_node" = "v${expected_node}"
          test "$actual_npm" = "$npm_version"
          npm ci

      - name: Report component contract impact
        if: always()
        run: npm run report:component-contract

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check JsViews templates
        run: npm run check:jsviews

      - name: Build preview
        run: npm run build:preview

      - name: Verify release gate
        run: node scripts/verify-release-gate.mjs

      - name: Report bundle budget
        if: always()
        run: npm run report:bundle-budget

      - name: Run full per-file coverage tests
        run: npm run test:coverage -- --coverage.all

      - name: Verify dependency evidence and audit
        run: npm run verify:dependencies

      - name: Upload dependency evidence and audit reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-evidence
          path: build/dependency-evidence/
          if-no-files-found: warn

      - name: Verify review impact
        run: npm run verify:review-impact

      - name: Upload review impact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-impact
          path: |
            build/contract-report/
            build/bundle-budget.json
            build/bundle-budget.md
            build/review-impact/
            build/bundle-graph.json
          if-no-files-found: warn

      - name: Capture tested dist inventory
        run: npm run verify:dist -- --write --json

      - name: Upload exact tested dist and inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tested-dist
          path: |
            dist/
            build/dist-inventory.json
          if-no-files-found: error

  release:
    needs: [quality, java-handoff]
    environment: production-release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout source for release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin and verify Node.js/npm, then install dependencies
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          package_manager="$(node --print "require('${GITHUB_WORKSPACE}/package.json').packageManager")"
          npm_version="${package_manager#npm@}"
          npm_prefix="${RUNNER_TEMP}/npm-toolchain"
          npm install --global --prefix "$npm_prefix" "npm@${npm_version}"
          export PATH="${npm_prefix}/bin:${PATH}"
          printf '%s\n' "${npm_prefix}/bin" >> "$GITHUB_PATH"
          cd "$GITHUB_WORKSPACE"
          expected_node="$(tr -d '[:space:]' < .nvmrc)"
          actual_node="$(node --version)"
          actual_npm="$(npm --version)"
          printf 'Node.js: %s (expected v%s)\nnpm: %s (expected %s)\n' "$actual_node" "$expected_node" "$actual_npm" "$npm_version"
          test "$actual_node" = "v${expected_node}"
          test "$actual_npm" = "$npm_version"
          npm ci

      - name: Download exact tested dist and inventory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tested-dist
          path: .

      - name: Download exact dependency evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependency-evidence
          path: build/dependency-evidence

      - name: Download Java dev handoff report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: java-handoff-dev
          path: build/java-handoff

      - name: Download Java master handoff report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: java-handoff-master
          path: build/java-handoff

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package_version="$(node --print "require('./package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Tag must use a SemVer-compatible v-prefixed version; received ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          if [[ "$version" != "$package_version" ]]; then
            echo "Tag version ${version} does not match package.json version ${package_version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Verify tag commit is reachable from origin/main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Verify release gate against downloaded dist
        run: node scripts/verify-release-gate.mjs

      - name: Verify downloaded dist inventory
        run: npm run verify:dist -- --check --json

      - name: Run browser visual and accessibility tests against exact dist
        run: npm run test:browser:dist

      - name: Create deployment smoke roots from downloaded dist
        run: |
          node scripts/deploy.mjs --target ./build/deploy-preview
          node scripts/deploy.mjs --target ./build/stage11-host/custom/content

      - name: Smoke deployed layouts
        run: npm run test:deployment:smoke

      - name: Verify exact dist continuity before packaging
        run: npm run verify:dist -- --check --json

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Prepare release content from tested artifacts
        run: npm run release:prepare -- --version "${{ steps.version.outputs.version }}" --commit "$GITHUB_SHA" --branch main --tag "$GITHUB_REF_NAME" --repository "${{ github.repository }}" --source-date-epoch "$(git show -s --format=%ct "$GITHUB_SHA")" --dist-inventory build/dist-inventory.json --java-dev-report build/java-handoff/dev.json --java-master-report build/java-handoff/master.json --ci-run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" --approval-environment production-release

      - name: Verify exact dist continuity after packaging
        run: npm run verify:dist -- --check --json

      - name: Create release archive
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          archive="nodel-webui-v2-${{ steps.version.outputs.version }}.zip"
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          find build/release -exec touch --date="@${source_date_epoch}" {} +
          (
            cd build/release
            find . -type f -print | LC_ALL=C sort | zip -X "../${archive}" -@
          )
          node scripts/verify-release-archive.mjs --target "build/${archive}" --json
          (
            cd build
            sha256sum "${archive}" > "${archive}.sha256"
          )
          echo "archive=build/${archive}" >> "$GITHUB_OUTPUT"
          echo "checksum=build/${archive}.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nodel-webui-v2-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.archive.outputs.archive }}
            ${{ steps.archive.outputs.checksum }}
          if-no-files-found: error

      - name: Attest release bundle
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.archive.outputs.archive }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          core_version="${version%%+*}"
          release_args=()
          if [[ "$core_version" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          remote_tag_commit="$(
            git ls-remote origin "refs/tags/${GITHUB_REF_NAME}" "refs/tags/${GITHUB_REF_NAME}^{}" | {
              direct_object=""
              peeled_object=""
              while IFS=$'\t' read -r object ref; do
                if [[ "$ref" == "refs/tags/${GITHUB_REF_NAME}" ]]; then
                  direct_object="$object"
                elif [[ "$ref" == "refs/tags/${GITHUB_REF_NAME}^{}" ]]; then
                  peeled_object="$object"
                fi
              done
              printf '%s' "${peeled_object:-$direct_object}"
            }
          )"
          if [[ -z "$remote_tag_commit" || "$remote_tag_commit" != "$GITHUB_SHA" ]]; then
            echo "Remote origin tag ${GITHUB_REF_NAME} is absent or no longer resolves to ${GITHUB_SHA}" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.archive.outputs.archive }}#Deployable Nodel Web UI bundle" \
            "${{ steps.archive.outputs.checksum }}#SHA-256 checksum" \
            --verify-tag \
            --notes-file RELEASE_NOTES.md \
            --title "Nodel Web UI v2 ${GITHUB_REF_NAME}" \
            "${release_args[@]}"
