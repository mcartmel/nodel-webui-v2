<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="/src/experiments/konva-canvas/style.css" />
    <script>
      (() => {
        const root = document.documentElement;
        const realMode = new URLSearchParams(window.location.search).get('source') === 'local';
        root.dataset.topologyRealMode = realMode ? 'true' : 'false';
        // The preview window is navigation-relative, not delayed until this inline script parses.
        root.dataset.topologyNavigationStarted = String(performance.timeOrigin);
        if (!realMode) root.dataset.topologyShellHidden = 'true';
        // Capture activation before either module (including the renderer) has loaded.
        window.__topologyShowNowRequested = false;
        document.addEventListener('click', (event) => {
          if (event.target instanceof Element && event.target.closest('[data-topology-show-now]')) {
            window.__topologyShowNowRequested = true;
            window.dispatchEvent(new Event('topology-show-now'));
          }
        });
      })();
    </script>
    <script>
      (() => {
        const root = document.documentElement;
        let theme = root.dataset.theme;
        if (theme !== 'light' && theme !== 'dark') {
          try {
            const stored = window.localStorage.getItem('nodel.theme');
            theme = stored === 'light' || stored === 'dark' ? stored : undefined;
          } catch {}
        }
        if (theme !== 'light' && theme !== 'dark') {
          try {
            theme = typeof window.matchMedia === 'function' && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } catch {
            theme = 'light';
          }
        }
        root.dataset.theme = theme;
      })();
    </script>
    <title>Konva topology canvas experiment</title>
  </head>
  <body>
    <main class="experiment-shell">
      <header class="experiment-header">
        <div>
          <p class="eyebrow"><span data-experiment-label>Synthetic rendering experiment</span> <span data-fixture-summary aria-live="off" aria-hidden="true"></span><span data-topology-short-summary aria-live="off"></span><span data-topology-accessible-summary class="topology-accessible-summary"></span><span data-inventory-scope hidden title="HTTP inventory coverage was tested against the pinned Java 19756071 REST serialization fixture. This view combines local inventory, configured references, and HTTP-advertised logical nodes. Isolated nonlocal nodes advertised only through non-HTTP routes are omitted.">HTTP advertisements only</span></p>
          <h1>Room network</h1>
        </div>
        <div class="view-controls" aria-label="Canvas view controls">
          <button type="button" data-view="zoom-out" aria-label="Zoom out">−</button>
          <button type="button" data-view="zoom-in" aria-label="Zoom in">+</button>
          <button type="button" data-view="reset">Reset view</button>
          <label class="size-control">Graph
            <select aria-label="Graph source" data-node-count>
              <option value="9">Synthetic · 9 nodes</option>
              <option value="50">Synthetic · 50 nodes</option>
              <option value="150">Synthetic · 150 nodes</option>
              <option value="450">Synthetic · 450 nodes</option>
              <option value="local">Local configuration</option>
            </select>
          </label>
          <label class="theme-control">Theme
            <select aria-label="Theme" data-theme-select>
              <option value="system">System</option>
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
          </label>
          <button type="button" data-topology-show-all hidden>Show all discovered</button>
          <button type="button" data-topology-arrange hidden>Arrange by connections</button>
        </div>
      </header>
      <section id="diagram" class="diagram" aria-label="Room network diagram">
        <div class="topology-startup-scrim" data-topology-scrim>
          <div class="topology-startup-panel">
            <span class="topology-startup-bar" aria-hidden="true"></span>
            <p data-topology-status role="status" aria-live="polite">Discovering nodes…</p>
            <button type="button" data-topology-show-now>Show now</button>
          </div>
        </div>
        <div class="topology-activity" data-topology-activity role="img" tabindex="0" aria-label="Discovery in progress" hidden>
          <span class="topology-activity-dot" aria-hidden="true"></span>
          <span class="topology-activity-tooltip" data-topology-activity-tooltip aria-hidden="true" hidden></span>
          <span class="topology-activity-counts" data-topology-counts aria-hidden="true"></span>
        </div>
        <p class="canvas-failure" role="status" aria-live="polite" hidden>Canvas rendering is unavailable in this browser.</p>
      </section>
    </main>
    <script type="module" src="/src/experiments/konva-canvas/preview-entry.ts"></script>
  </body>
</html>
